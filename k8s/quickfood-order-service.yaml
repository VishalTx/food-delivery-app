apiVersion: v1
kind: ConfigMap
metadata:
  name: quickfood-order-config
  labels:
    app.kubernetes.io/name: quickfood-order-service
data:
  SPRING_APPLICATION_NAME: order-service
  SERVER_PORT: "8083"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_JPA_OPEN_IN_VIEW: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickfood-order-service
  labels:
    app.kubernetes.io/name: quickfood-order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quickfood-order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quickfood-order-service
    spec:
      containers:
        - name: order-service
          image: quickfood/order-service:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: quickfood-order-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: quickfood-order-service
  labels:
    app.kubernetes.io/name: quickfood-order-service
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: quickfood-order-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP